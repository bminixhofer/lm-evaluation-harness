# Based on tasks/openbookqa/openbookqa.yaml

task: openbookqa.bpb
dataset_path: openbookqa
dataset_name: main
training_split: train
validation_split: validation
test_split: test
should_decontaminate: true
doc_to_decontamination_query: question_stem

# doc_to_text: question_stem
# doc_to_target: "{{choices.text[choices.label.index(answerKey.lstrip())]}}"

# Format based on AllenAI's (the authors of this benchmark) implementation: https://github.com/allenai/olmes/blob/main/oe_eval/tasks/oe_eval_tasks/openbookqa.py
# Include answer choices in prompt, answer is just the single letter A, B, ... E.g.,
# Question: When food is reduced in the stomach
# A. the mind needs time to digest
# B. take a second to digest what I said
# C. nutrients are being deconstructed
# D. reader's digest is a body of works
# Answer: C. nutrients are being deconstructed
doc_to_text: "Question: {{ question_stem.strip() }}\n{% for text in choices['text'] %}{{ choices['label'][loop.index0] }}. {{ text }}\n{% endfor %}Answer: "
doc_to_target: "{{ answerKey.upper().lstrip() }}. {{ choices['text'][choices.label.index(answerKey.lstrip())] }}" # {{ letter }}. {{ gold_answer }}
output_type: loglikelihood
metric_list:
  - metric: bits_per_byte
    aggregation: bits_per_byte
    higher_is_better: false
  - metric: byte_perplexity
    aggregation: weighted_perplexity
    higher_is_better: false
  - metric: token_perplexity
    aggregation: weighted_perplexity
    higher_is_better: false
  # - metric: acc
  #   aggregation: mean
  #   higher_is_better: true
  # - metric: acc_norm
  #   aggregation: mean
  #   higher_is_better: true

metadata:
  version: 1.0
