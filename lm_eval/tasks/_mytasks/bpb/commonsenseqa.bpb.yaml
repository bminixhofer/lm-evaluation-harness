# Based on tasks/commonsense_qa/default.yaml

task: commonsense_qa.bpb
dataset_path: tau/commonsense_qa
training_split: train
validation_split: validation
doc_to_text: "Question: {{ question.strip() }}\nA. {{choices['text'][0]}}\nB. {{choices['text'][1]}}\nC. {{choices['text'][2]}}\nD. {{choices['text'][3]}}\nE. {{choices['text'][4]}}\nAnswer: "
# doc_to_target: answerKey
doc_to_target: "{{ answerKey.upper() }}. {{ choices['text'][choices.label.index(answerKey)] }}" # {{ letter }}. {{ gold_answer }}
# doc_to_target: "{{ choices['text'][choices.label.index(answerKey)] }}" # {{ gold_answer }}
# doc_to_choice: ["A", "B", "C", "D", "E"]

output_type: loglikelihood
metric_list:
    - metric: bits_per_byte
      aggregation: bits_per_byte
      higher_is_better: false
    - metric: byte_perplexity
      aggregation: weighted_perplexity
      higher_is_better: false
    - metric: token_perplexity
      aggregation: weighted_perplexity
      higher_is_better: false
    # - metric: acc
    #   aggregation: mean
    #   higher_is_better: true
    # - metric: acc_norm
    #   aggregation: mean
    #   higher_is_better: true
