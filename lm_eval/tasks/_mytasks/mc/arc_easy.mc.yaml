tag:
    - ai2_arc
task: arc_easy.mc
dataset_path: benjamin/ai2_arc_full_sentence
dataset_name: ARC-Easy
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: test
doc_to_text: "Question: {{ question.strip() }}\n{% for text in choices['text'] %}{{ choices['label'][loop.index0] }}. {{ text }}\n{% endfor %}Answer:"
doc_to_target: "{{choices.label.index(answerKey)}}"
doc_to_choice: "{%set options=[]%}{%for text in choices['text']%}{{options.append(choices['label'][loop.index0] ~ '. ' ~ text) or ''}}{% endfor %}{{options}}"
should_decontaminate: true
doc_to_decontamination_query: "Question: {{question}}\nAnswer:"
metric_list:
    - metric: acc
      aggregation: mean
      higher_is_better: true
    - metric: acc_norm
      aggregation: mean
      higher_is_better: true
metadata:
    version: 1.0
